[package]
name = "acta-maker-sdk"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Rust SDK for Acta options market makers — WebSocket client, order signing, message types"
repository = "https://github.com/acta-markets/rust-maker-sdk"
documentation = "https://docs.rs/acta-maker-sdk"
keywords = ["rfq", "options", "defi", "solana", "market-maker"]
categories = ["api-bindings"]
readme = "README.md"
exclude = ["scripts/"]

[package.metadata.docs.rs]
features = ["ws-client", "chain-rpc"]
targets = []

[dependencies]
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["zeroize"] }
futures-util = { version = "0.3", optional = true }
hex = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3.16.1", features = ["macros"] }
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"], optional = true }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }

solana-rpc-client = { version = "3.1.14", optional = true }
solana-sdk = { version = "3.0.0", optional = true }
solana-commitment-config = { version = "3.0.0", optional = true }
solana-compute-budget-interface = { version = "3.0.0", optional = true }

[features]
default = []
ws-client = ["dep:futures-util", "dep:tokio", "dep:tokio-tungstenite"]
test-helpers = ["ws-client"]
chain = ["dep:solana-sdk"]
chain-rpc = [
  "chain",
  "dep:solana-rpc-client",
  "dep:solana-commitment-config",
  "dep:solana-compute-budget-interface",
]

[[example]]
name = "hello_auth"
required-features = ["ws-client"]

[[example]]
name = "quote"
required-features = ["ws-client"]

[[example]]
name = "discovery"
required-features = ["ws-client"]

[[example]]
name = "indicative"
required-features = ["ws-client"]

[[example]]
name = "managed_quote"
required-features = ["ws-client"]

[[example]]
name = "loopback_latency"
required-features = ["ws-client"]

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.perf]
inherits = "release"
opt-level = 3
lto = "thin"
debug = 1
strip = false
